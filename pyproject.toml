[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ihsg-fx"
version = "0.1.0"
description = "Daily relationship between the Jakarta Composite Index and USD/IDR"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "scipy>=1.11",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "ipykernel>=6.0", "nbconvert>=7.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
